kind = "web"
previewPath = "/"
title = "ROYAL EQUINE"
description = "A premium bilingual equestrian e-commerce storefront for ROYAL EQUINE in Kuwait, matching the supplied Stitch design and supporting product discovery, favorites, a persistent cart, product details, and a responsive checkout experience in English and Arabic with KWD pricing."
version = "1.0.0"
id = "artifacts/royal-equine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20188

[services.development]
run = "pnpm --filter @workspace/royal-equine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/royal-equine", "run", "build" ]
serve = "static"
publicDir = "artifacts/royal-equine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20188"
BASE_PATH = "/"
