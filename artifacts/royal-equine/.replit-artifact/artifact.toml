kind = "web"
previewPath = "/"
title = "ROYAL EQUINE"
description = "A premium bilingual equestrian storefront and API for ROYAL EQUINE in Kuwait, with database-backed products, secure client accounts, private orders, admin tools, and KWD checkout."
version = "1.0.0"
id = "artifacts/royal-equine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20188

[services.development]
run = "pnpm --filter @workspace/royal-equine run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/royal-equine", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/royal-equine", "run", "start" ]

[services.production.run.env]
PORT = "20188"
NODE_ENV = "production"
BASE_PATH = "/"

[services.production.health.startup]
path = "/api/healthz"

[services.env]
PORT = "20188"
BASE_PATH = "/"